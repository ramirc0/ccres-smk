executor: slurm
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

jobs: 100
max-jobs-per-second: 5

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8
slurm-init-seconds-before-status-checks: 10

# zlurm has no accounts. Each partition caps runtime: 30mins, 4hours, 12hours,
# 5days. A runtime above the partition cap pends forever, so set both together.
default-resources:
  slurm_partition: 30mins
  runtime: 30m
  mem_mb: 4000

set-resources:              # tune from benchmarks/ TSVs after a real run
  call_dhs:
    mem_mb: 32000 * attempt
    runtime: 30m
  process_dhs:
    mem_mb: 4000 * attempt
    runtime: 30m
  combine_dhs:
    slurm_partition: 4hours
    mem_mb: 100000 * attempt
    runtime: 120m
  create_rdhs:
    slurm_partition: 4hours
    mem_mb: 64000 * attempt
    runtime: 120m
  derive_constants:
    slurm_partition: 4hours
    mem_mb: 32000 * attempt
    runtime: 120m
  tf_peaks:
    slurm_partition: 4hours
    mem_mb: 16000 * attempt
    runtime: 120m
  tf_rpeaks:
    slurm_partition: 4hours
    mem_mb: 128000 * attempt
    runtime: 120m
  tf_clusters:
    slurm_partition: 4hours
    mem_mb: 128000 * attempt
    runtime: 120m
  extend_anchors:
    mem_mb: 8000 * attempt
  signal_zscore:
    mem_mb: 8000 * attempt
  max_zscore:
    slurm_partition: 4hours
    mem_mb: 16000 * attempt
    runtime: 120m
  classify_ccres:
    mem_mb: 16000 * attempt
  cell_type_ccres:
    mem_mb: 16000 * attempt

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
