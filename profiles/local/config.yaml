# Local execution.
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

cores: 64
resources:                  # caps the sum over running jobs
  mem_mb: 800000
printshellcmds: true
rerun-incomplete: true
keep-going: true
show-failed-logs: true
retries: 1
benchmark-extended: true

default-resources:          # fallback for trivial rules
  mem_mb: 2000
  runtime: 30

set-resources:              # tune from benchmarks/ TSVs after a real run
  call_dhs: {mem_mb: 32000}
  process_dhs: {mem_mb: 4000}
  combine_dhs: {mem_mb: 100000}
  create_rdhs: {mem_mb: 64000}
  tf_peaks: {mem_mb: 16000}
  tf_rpeaks: {mem_mb: 64000}
  tf_clusters: {mem_mb: 128000}
  extend_anchors: {mem_mb: 8000}
  signal_zscore: {mem_mb: 8000}
  max_zscore: {mem_mb: 16000}
  classify_ccres: {mem_mb: 16000}
  cell_type_ccres: {mem_mb: 16000}
