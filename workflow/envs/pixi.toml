[workspace]
name = "ccres-smk-envs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
numpy = ">=2.3,<3"
polars = ">=1.30"
numba = ">=0.68"
blake3 = ">=1.0"
# Output bytes depend on these binaries. Bump them only with a full re-verification.
ucsc-bigwigaverageoverbed = "==482"
ucsc-bedtobigbed = "==482"
ucsc-bigbedtobed = "==482"
htslib = ">=1.21"
pyarrow = ">=23.0.1,<25"
datafusion = ">=53,<54"
polars-config-meta = ">=0.3.2,<1"
# Builds polars-bio from source. Its rust-toolchain.toml pins 1.91.0.
rust = "==1.91.0"

# polars 2 support is unreleased (PR #478, planned for 0.37.0).
[pypi-dependencies]
polars-bio = { git = "https://github.com/biodatageeks/polars-bio", rev = "fd622fc8a099a86f6972671471d9f972077d1eb1" }

[feature.test.dependencies]
pytest = ">=8"
pytest-xdist = ">=3"

# bedtools 2.30.0 ran the May 2022 release. Unit tests use it as the oracle. Rules never call it.
# Its zlib pin conflicts with the UCSC tools, so it gets its own env.
[feature.test.activation.env]
BEDTOOLS = "$PIXI_PROJECT_ROOT/.pixi/envs/oracle/bin/bedtools"

[feature.oracle.dependencies]
bedtools = "==2.30.0"

[environments]
test = ["test"]
oracle = { features = ["oracle"], no-default-feature = true }
