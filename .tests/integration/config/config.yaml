outdir: data/results
pixi_env: default
run_id: v7               # outputs go under <outdir>/<run_id>/<genome>/; override per run

inputs_dir: data/inputs                      # frozen inputs, checked against config/inputs.b3
encode_root: resources/encode      # ENCODE mirror, <exp>/<file>.<ext>
download_dir: data/encode                    # same layout, for files missing from the mirror
# ENCODE metadata snapshot, one Parquet file per object type. download_encode
# reads file.parquet (s3_uri, md5sum), Biosample-Keys.txt the biosamples.
encode_metadata: resources/metadata

# Constants hardcoded in the original scripts. No published code derives them.
# min_p: minP in 0_Call-DHSs.sh (last FDR threshold, 1E-<min_p>). That script
#   is hardcoded to hg38, so the mm10 value is unverified.
# dhs_signal_cutoff: 2_Create-rDHSs.sh, "10% of 10,000,000 randomly selected
#   DHSs". The sample and its seed were not kept.
genomes:
  hg38:
    min_p: 4942
    dhs_signal_cutoff: 0.145873
  mm10:
    min_p: 4942
    dhs_signal_cutoff: 0.203923

# Frozen input name -> source file(s). freeze_input copies a single source.
# The derived inputs filter their sources (see workflow/scripts/freeze_input.py).
# Biosample-Keys.txt, derived from the frozen lists and encode_metadata, has none.
sources:
  hg38:
    Hotspot-List.txt: resources/hg38/Hotspot-List.txt
    DNase-List.txt: resources/hg38/DNase-List.txt
    H3K4me3-List.txt: resources/hg38/H3K4me3-List.txt
    H3K27ac-List.txt: resources/hg38/H3K27ac-List.txt
    CTCF-List.txt: resources/hg38/CTCF-List.txt
    ATAC-List.txt: resources/hg38/ATAC-List.txt
    TF-List-All.txt: resources/hg38/TF-List-All.txt
    cDHSs.bed: resources/hg38/cDHSs.bed
    rDHS-Previous.bed.gz: resources/hg38/rDHS-Previous.bed.gz
    TSS-Basic.bed: resources/hg38/TSS-Basic.bed
    TSS-Basic-4K.bed: resources/hg38/TSS-Basic-4K.bed
    chromInfo.txt: resources/hg38/chromInfo.txt
    cres.as: resources/hg38/cres.as
    cCREs-Previous.bed: resources/hg38/cCREs.bed.gz
  mm10:
    Hotspot-List.txt: resources/mm10/Hotspot-List.txt
    DNase-List.txt: resources/mm10/DNase-List.txt
    H3K4me3-List.txt: resources/mm10/H3K4me3-List.txt
    H3K27ac-List.txt: resources/mm10/H3K27ac-List.txt
    CTCF-List.txt: resources/mm10/CTCF-List.txt
    ATAC-List.txt: resources/mm10/ATAC-List.txt
    TF-List-All.txt: resources/mm10/TF-List-All.txt
    cDHSs.bed: resources/mm10/cDHSs.bed
    rDHS-Previous.bed.gz: resources/mm10/rDHS-Previous.bed.gz
    TSS-Basic.bed: resources/mm10/TSS-Basic.bed
    TSS-Basic-4K.bed: resources/mm10/TSS-Basic-4K.bed
    chromInfo.txt: resources/mm10/chromInfo.txt
    cres.as: resources/mm10/cres.as
    cCREs-Previous.bed: resources/mm10/cCREs.bed.gz
